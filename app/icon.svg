<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cinemaGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="#0b0f19" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#cinemaGradient)" stroke-width="8" stroke-opacity="0.4" />
  
  <!-- Film Reel / Clapperboard Icon -->
  <g filter="url(#glow)" transform="translate(106, 106)">
    <!-- Main Screen/Film Frame -->
    <rect x="0" y="30" width="300" height="240" rx="32" fill="#1e293b" stroke="url(#cinemaGradient)" stroke-width="14" />
    
    <!-- Top Film Reel Strip -->
    <rect x="0" y="30" width="300" height="50" rx="16" fill="url(#cinemaGradient)" />
    
    <!-- Sprocket Holes -->
    <rect x="25" y="45" width="22" height="20" rx="6" fill="#0b0f19" />
    <rect x="75" y="45" width="22" height="20" rx="6" fill="#0b0f19" />
    <rect x="125" y="45" width="22" height="20" rx="6" fill="#0b0f19" />
    <rect x="175" y="45" width="22" height="20" rx="6" fill="#0b0f19" />
    <rect x="225" y="45" width="22" height="20" rx="6" fill="#0b0f19" />
    
    <!-- Play Triangle in Screen -->
    <polygon points="125,120 125,200 195,160" fill="url(#cinemaGradient)" />
  </g>
</svg>
